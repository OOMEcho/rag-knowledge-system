services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-knowledge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rag_knowledge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-knowledge-app
    profiles:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      RAG_SECURITY_ENABLED: ${RAG_SECURITY_ENABLED:-false}
      RAG_API_KEYS: ${RAG_API_KEYS:-}
      RAG_API_KEY_HEADER: ${RAG_API_KEY_HEADER:-X-API-Key}
      RAG_CORS_ALLOWED_ORIGINS: ${RAG_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RAG_RATE_LIMIT_ENABLED: ${RAG_RATE_LIMIT_ENABLED:-true}
      RAG_RATE_LIMIT_RPM: ${RAG_RATE_LIMIT_RPM:-120}
      RAG_RATE_LIMIT_RAG_RPM: ${RAG_RATE_LIMIT_RAG_RPM:-30}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-5}
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-20}
      RAG_DEFAULT_SIMILARITY_THRESHOLD: ${RAG_DEFAULT_SIMILARITY_THRESHOLD:-0.65}
      RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-true}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_CHANNEL_POOL_MULTIPLIER: ${RAG_CHANNEL_POOL_MULTIPLIER:-2}
      SERVER_PORT: 8080
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rag_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.6:35b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      RAG_STORAGE_LOCAL_ROOT: /app/data/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - rag_knowledge_upload_data:/app/data/uploads
    restart: unless-stopped

volumes:
  rag_knowledge_postgres_data:
  rag_knowledge_upload_data:
